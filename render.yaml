services:
  - type: web
    name: oyin-sbp
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /sw.js
        headers:
          - key: Cache-Control
            value: no-cache
      - path: /index.html
        headers:
          - key: Cache-Control
            value: no-cache
      - path: /manifest.json
        headers:
          - key: Cache-Control
            value: no-cache
      - path: /assets/*
        headers:
          - key: Cache-Control
            value: public, max-age=31536000, immutable
